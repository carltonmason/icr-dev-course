[project]
name = "icr-dev-course"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = [
    "src/good-habits/bad_analysis.py",
    "src/good-habits/better_names_analysis.py",
]
force-exclude = true
